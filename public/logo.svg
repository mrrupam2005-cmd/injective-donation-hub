<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Outer Shield -->
    <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="none" stroke="url(#cyberGreen)" stroke-width="4" filter="url(#glow)" />
    <!-- Inner Core -->
    <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="rgba(15, 23, 42, 0.8)" stroke="url(#cyberCyan)" stroke-width="2" />
    <!-- Checkmark V -->
    <path d="M35,50 L45,62 L65,38" fill="none" stroke="url(#cyberGreen)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  </g>

  <!-- Logo Text -->
  <text x="120" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">
    INJECTIVE
  </text>
  <text x="120" y="92" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="url(#cyberGreen)" letter-spacing="6" filter="url(#glow)">
    VOTING ARENA
  </text>
</svg>
